AWSTemplateFormatVersion: '2010-09-09'
Description: >
  One-time setup for WashOps continuous deployment from GitHub Actions without stored AWS keys.
  GitHub's OIDC token is exchanged for short-lived credentials of a deploy role that can only
  deploy the WashOps dev and prod stacks, through CloudFormation, from the main branch of one
  repository. Deploy this stack under a name that does NOT start with the app stack's name
  (e.g. github-deploy-washops).

Parameters:
  GitHubRepository:
    Type: String
    Default: JesDiaz01/Washop-aws
    Description: owner/name of the repository allowed to deploy
  AppStackName:
    Type: String
    Default: washops
    Description: Name of the production stack (must match samconfig.toml)
  DevStackName:
    Type: String
    Default: washops-dev
    Description: Name of the dev stack the pipeline deploys and tests first (must match samconfig.toml)
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set to false if this account already has the token.actions.githubusercontent.com identity provider

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  # Lets IAM trust tokens that GitHub Actions issues (one per account).
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # Where `sam deploy` uploads the Lambda bundles and the processed template.
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts # every deploy uploads new bundles; old ones are only needed for rollback
            Status: Enabled
            ExpirationInDays: 30

  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonTlsRequests
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub ${ArtifactsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # CloudFormation assumes this role to create the stack's resources. The GitHub role can't use
  # these permissions directly; it can only hand this role to CloudFormation for the app stack.
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub Used by CloudFormation to deploy the ${AppStackName} stack
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Every service except IAM; IAM is limited to the stack's own roles below.
        - !Sub arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: manage-stack-roles
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageOnlyThisStacksRoles # CloudFormation names them <stack>-<LogicalId>-<suffix>
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-* # also matches the dev stack (washops-dev-*)
              - Sid: NeverTouchTheDeployRoles # an app template must not be able to widen its own deploy permissions
                Effect: Deny
                Action: 'iam:*'
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-*

  # GitHub Actions assumes this role. It can upload artifacts and run CloudFormation change sets
  # on the app stack, and nothing else.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub Assumed by GitHub Actions (${GitHubRepository}, main branch) to deploy ${DevStackName} and ${AppStackName}
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only workflow runs on main in this repository; pull requests and forks get nothing.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy-app-stack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: UploadArtifacts
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub ${ArtifactsBucket.Arn}/*
              - Sid: FindArtifacts
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt ArtifactsBucket.Arn
              - Sid: DeployAppStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${DevStackName}/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*
              - Sid: UseTransforms # the app template uses the LanguageExtensions and Serverless transforms
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/LanguageExtensions
              - Sid: ReadTestCredential # integration tests fetch the demo site's client secret from the dev user pool
                Effect: Allow
                Action: cognito-idp:DescribeUserPoolClient
                Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
              - Sid: ReadTemplateMetadata # read-only calls the SAM CLI makes before a stack is named
                Effect: Allow
                Action: [cloudformation:GetTemplateSummary, cloudformation:ValidateTemplate]
                Resource: '*'
              - Sid: HandRoleToCloudFormation
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

Outputs:
  DeployRoleArn:
    Description: GitHub repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationExecutionRoleArn:
    Description: GitHub repository variable CFN_EXECUTION_ROLE_ARN
    Value: !GetAtt CloudFormationExecutionRole.Arn
  ArtifactsBucketName:
    Description: GitHub repository variable SAM_ARTIFACTS_BUCKET
    Value: !Ref ArtifactsBucket
