# Monthly dependency updates, grouped into one pull request per ecosystem. CI runs the unit tests
# and the SAM build on each one; merging to main then goes through the normal pipeline.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
