name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the repo. No AWS credentials are used by CI.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc # Node 22, same as the Lambda runtime
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  sam:
    name: Validate and build SAM template
    runs-on: ubuntu-latest
    needs: verify
    env:
      AWS_DEFAULT_REGION: us-east-1 # required by the SAM CLI; nothing is deployed
      SAM_CLI_TELEMETRY: 0
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - run: npm ci
      - run: npm run sam:validate
      # Via npm so node_modules/.bin (esbuild) is on PATH; SAM's builder does not find dev dependencies otherwise.
      - run: npm run sam:build
